name: GPU context options and resource control
"on":
  workflow_call:
    inputs:
      regressions:
        type: string
        default: 'full'
  workflow_dispatch:
    inputs:
      regressions:
        type: choice
        options: ['full', 'none']
        default: 'full'
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
jobs:
  linux:
    name: GPU context controls / Linux EGL / Racket ${{ matrix.racket }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        racket: ['8.18', '9.3']
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      EGL_PLATFORM: surfaceless
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned-runtime system dependencies and Mesa
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip curl fontconfig fonts-dejavu-core fonts-liberation fonts-noto-core libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgtk-3-0t64 libgl1 libegl1 libegl-mesa0 libgl1-mesa-dri
      - uses: Bogdanp/setup-racket@2466913449df77df2bad149d1f2fc4e1ea4795dd
        with:
          version: ${{ matrix.racket }}
          architecture: x64
          distribution: full
          variant: CS
      - name: Verify source and install pinned native libraries
        run: |
          python tools/update-source-sums.py --check
          python -m pip install -r tools/dc-output-requirements.txt
          bash tools/install-native.sh
          bash tools/install-harfbuzz.sh
      - name: Required context options and targeted lifecycle execution
        env:
          SKIA_REGRESSIONS_MODE: ${{ inputs.regressions }}
        run: python tools/validate-gpu-context-controls.py --racket "$(command -v racket)" --regressions "$SKIA_REGRESSIONS_MODE" --require-gpu --backend egl --directory output/gpu-context-controls-linux
      - name: Require GPU diagnostics and retained-interface evidence
        run: >-
          python tools/validate-gpu-diagnostics.py
          --racket "$(command -v racket)" --regressions none
          --require-gpu --backend egl --directory output/gpu-diagnostics-linux
      - name: Keep complete GPU evidence and command logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gpu-context-controls-linux-${{ matrix.racket }}-${{ github.run_attempt }}
          path: output/gpu-context-controls-linux/
          if-no-files-found: warn
          retention-days: 14

      - name: Keep GPU diagnostics evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gpu-diagnostics-linux-${{ matrix.racket }}-${{ github.run_attempt }}
          path: output/gpu-diagnostics-linux/
          if-no-files-found: warn
          retention-days: 14
  windows:
    name: GPU context controls / Windows WARP / Racket 9.3
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: Bogdanp/setup-racket@2466913449df77df2bad149d1f2fc4e1ea4795dd
        with:
          version: '9.3'
          architecture: x64
          distribution: full
          variant: CS
      - name: Verify source and install pinned native libraries
        run: |
          python tools/update-source-sums.py --check
          python -m pip install -r tools/dc-output-requirements.txt
          python tools/install-native-windows.py --racket (Get-Command racket).Source
      - name: Required context options and targeted lifecycle execution
        env:
          SKIA_REGRESSIONS_MODE: ${{ inputs.regressions }}
        run: python tools/validate-gpu-context-controls.py --racket (Get-Command racket).Source --regressions "$env:SKIA_REGRESSIONS_MODE" --require-gpu --backend direct3d --adapter warp --directory output/gpu-context-controls-windows
      - name: Require GPU diagnostics and non-GL rejection
        run: >-
          python tools/validate-gpu-diagnostics.py
          --racket (Get-Command racket).Source --regressions none
          --require-gpu --backend direct3d --adapter warp --directory output/gpu-diagnostics-windows
      - name: Keep complete GPU evidence and command logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gpu-context-controls-windows-${{ github.run_attempt }}
          path: output/gpu-context-controls-windows/
          if-no-files-found: warn
          retention-days: 14

      - name: Keep GPU diagnostics evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gpu-diagnostics-windows-${{ github.run_attempt }}
          path: output/gpu-diagnostics-windows/
          if-no-files-found: warn
          retention-days: 14
