name: Release candidate

# Deliberately opt-in: normal pushes retain the existing three workflows.
# Select the exact candidate ref when dispatching. No checkout of workflow_run
# artifacts, pull_request_target, secrets inheritance, publication or write token.
"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
  acceptance:
    name: Acceptance
    uses: ./.github/workflows/acceptance.yml
    with:
      regressions: full
  inventory:
    name: API inventory
    uses: ./.github/workflows/api-inventory.yml
  required:
    name: Release candidate required
    if: always()
    needs: [ci, acceptance, inventory]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install release validator dependencies
        run: python -m pip install -r tools/release-requirements.txt
      - name: Verify one complete candidate run and retain source plus evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python tools/validate-release-candidate.py --github --directory output/release-candidate
      - name: Retain candidate decision and evidence even after failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: output/release-candidate/
          if-no-files-found: error
          retention-days: 30
