name: Unified render canvas
"on":
  workflow_call:
    inputs:
      regressions:
        description: Global regression scope; feature acceptance always runs.
        type: string
        required: false
        default: 'full'
  workflow_dispatch:
    inputs:
      regressions:
        description: Global regression scope; none is feature acceptance only.
        type: choice
        options: ['full', 'none']
        default: 'full'
permissions:
  contents: read
jobs:
  linux:
    name: Render canvas / Linux Mesa / Racket ${{ matrix.racket }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        racket: ['8.18', '9.3']
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install Mesa, GUI runtime, fonts and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            unzip curl fontconfig fonts-dejavu-core fonts-liberation fonts-noto-core fonts-noto-cjk \
            libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgtk-3-0t64 \
            libgl1 libegl1 libegl-mesa0 libgl1-mesa-dri xvfb xauth
      - uses: Bogdanp/setup-racket@2466913449df77df2bad149d1f2fc4e1ea4795dd
        with:
          version: ${{ matrix.racket }}
          architecture: x64
          distribution: full
          variant: CS
      - name: Source contracts and actual example compilation
        run: |
          python tools/update-source-sums.py --check
          python tools/test-render-canvas.py
          python tools/test-gpu-frame-reuse.py
          racket -l raco -- make render-canvas.rkt examples/render-canvas.rkt examples/gpu-dc-consumers.rkt
      - name: Global pure regressions (standalone mode)
        if: inputs.regressions != 'none'
        run: racket run-tests.rkt --pure
      - name: Install pinned native libraries
        run: |
          bash tools/install-native.sh
          bash tools/install-harfbuzz.sh
      - name: Require common API and staging reuse
        run: |
          xvfb-run -a -s '-screen 0 1280x800x24' \
            python tools/validate-gpu-frame-reuse.py --racket "$(command -v racket)" \
            --require-gpu --backend egl --directory output/render-canvas-ci
      - name: Retain all logs, receipt checks and backing pixels
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: render-canvas-linux-${{ matrix.racket }}-${{ github.run_attempt }}
          path: output/render-canvas-ci/
          if-no-files-found: warn
          retention-days: 14
  windows:
    name: Render canvas / Windows WARP / Racket 9.3
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: Bogdanp/setup-racket@2466913449df77df2bad149d1f2fc4e1ea4795dd
        with:
          version: '9.3'
          architecture: x64
          distribution: full
          variant: CS
      - name: Source contracts
        shell: pwsh
        run: |
          python tools/update-source-sums.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test-render-canvas.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test-gpu-frame-reuse.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          racket -l raco -- make render-canvas.rkt examples/render-canvas.rkt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install pinned native libraries
        shell: pwsh
        run: |
          ./tools/install-native-windows.ps1 -Racket racket -Python python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require common API and staging reuse using explicit WARP
        shell: pwsh
        run: |
          python tools/validate-gpu-frame-reuse.py --racket racket --require-gpu --backend direct3d --adapter warp --directory output/render-canvas-ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain all logs, receipt checks and backing pixels
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: render-canvas-windows-warp-${{ github.run_attempt }}
          path: output/render-canvas-ci/
          if-no-files-found: warn
          retention-days: 14
